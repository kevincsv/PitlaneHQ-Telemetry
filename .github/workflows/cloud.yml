name: Pitlane HQ Cloud (web version)

# Runs only when started by hand (Actions → Run workflow, or `gh workflow run cloud.yml --ref master`): pushing to
# master no longer deploys. It checks the web version and, when these repository secrets
# exist, also publishes it to your Cloudflare account, creating the D1
# database and its tables the first time:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" + Account · D1 · Edit)
#   CLOUDFLARE_ACCOUNT_ID
#   PITLANE_KEY            optional: the older key sign-in of the lap site (owner/team keys)
# Optional: PITLANE_D1_ID secret (an existing database) and the repository
# variables SEASON_UPLOADERS and ADMINS (your Pitlane HQ account id) and
# CUSTOM_DOMAIN (your own domain in Cloudflare, e.g. pitlanehq.com).
# Emails: variable EMAIL_FROM ("Pitlane HQ <support@pitlanehq.app>") plus the secret RESEND_API_KEY.
# Encryption at rest: secret DATA_KEY (a long random string; never change it once set, or the
# sealed rows cannot be read). Optional EMAIL_PEPPER (set before the first account).
# Discord bot: variable DISCORD_APP_ID and secrets DISCORD_PUBLIC_KEY and DISCORD_BOT_TOKEN (Discord Developer
# Portal → your application); the deploy then registers its slash commands. "Link Discord" in the apps also needs
# the secret DISCORD_CLIENT_SECRET (OAuth2 → Client Secret) and https://pitlanehq.app/discord/oauth as a redirect.
# Instant phone notifications: secret FCM_SERVICE_ACCOUNT, the whole JSON key of the Firebase project's service
# account (Firebase console → Project settings → Service accounts → Generate new private key).

# Every server change goes to the testers first (docs/spec/pc-app.md, "Test builds"):
# - channel "beta" (the default, any branch): deploys this branch as its own Worker, pitlanehq-beta, on
#   beta.<CUSTOM_DOMAIN> with the same database and files (cloud/src/beta.js: testers and admins only, no timed jobs).
#   It never changes the database: a branch with migrations pitlanehq.app does not have stops, unless
#   apply_migrations is ticked (the owner's call; a migration must keep pitlanehq.app working as it is).
# - channel "production" (master only): deploys pitlanehq.app, only when master's server and web are what the last
#   test version ran. skip_testing: an urgent fix when the app is broken for people, only when the owner says so.

on:
  workflow_dispatch: # by hand only: a push never deploys
    inputs:
      channel:
        description: "beta = the test version (beta.pitlanehq.app); production = pitlanehq.app, after testing (master)"
        type: choice
        options: [beta, production]
        default: beta
      apply_migrations:
        description: "Beta only, when the owner says so: apply this branch's new database migrations"
        type: boolean
        default: false
      skip_testing:
        description: "Urgent fix only, when the owner says so: deploy master to pitlanehq.app without a test version"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never stop a deploy halfway through its migrations

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ secrets.PITLANE_D1_ID }}
      PITLANE_KEY: ${{ secrets.PITLANE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
      EMAIL_PEPPER: ${{ secrets.EMAIL_PEPPER }}
      PATREON_WEBHOOK_SECRET: ${{ secrets.PATREON_WEBHOOK_SECRET }}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      SEASON_UPLOADERS: ${{ vars.SEASON_UPLOADERS }}
      ADMINS: ${{ vars.ADMINS }}
      # the server's own address (pitlanehq.app); the repository variable CUSTOM_DOMAIN overrides it
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'pitlanehq.app' }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # what leaves for people's browsers and phones is minified, without comments, with a copyright line
      # (tools/protect-web.mjs): only this run's checkout changes, the repository keeps the readable source
      - name: Protect the web app's code
        run: node ../tools/protect-web.mjs ../web/dist
      - name: Check that it builds
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Production only from master, after testing
        if: inputs.channel == 'production'
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then echo "::error::pitlanehq.app comes only from master"; exit 1; fi
          if [ "${{ inputs.skip_testing }}" = "true" ]; then echo "::warning::Deployed without a test version (urgent fix)"; exit 0; fi
          git fetch -q --unshallow origin '+refs/heads/*:refs/remotes/origin/*' || git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          curl -fsSL https://beta.pitlanehq.app/dl/beta/cloud.json -o beta.json || { echo "::error::There is no test version yet: run this workflow with channel beta first"; exit 1; }
          b=$(node -p 'require("./beta.json").build||""')
          git cat-file -e "$b^{commit}" 2>/dev/null || { echo "::error::The test version's commit $b is not in this repository any more"; exit 1; }
          # what testers ran must be this server and this web app (the inbox notices are the owner's, asked one by one)
          if ! git diff --quiet "$b" HEAD -- cloud web license_plans.json ':(exclude)web/dist/app-news.json'; then
            git diff --stat "$b" HEAD -- cloud web license_plans.json ':(exclude)web/dist/app-news.json' | tail -20
            echo "::error::master has server or web changes testers have not run: deploy master with channel beta, test it, then deploy production"
            exit 1
          fi
      - name: Publish the test version (beta.<domain>)
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.channel != 'production'
        run: |
          set -e
          find_db() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="pitlanehq");console.log(d?d.uuid:"")}catch(e){console.log("")}})'; }
          DB_ID="$D1_ID"
          if [ -z "$DB_ID" ]; then DB_ID=$(find_db); fi
          if [ -z "$DB_ID" ]; then echo "::error::The database does not exist yet: deploy production first"; exit 1; fi
          sed -i "s/^migrations_dir = \"migrations\"/migrations_dir = \"migrations\"\ndatabase_id = \"$DB_ID\"/" wrangler.toml
          # the database is pitlanehq.app's: the test version never changes it unless the owner said so
          pending=$(npx wrangler d1 migrations list DB --remote 2>&1 | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' || true)
          if [ -n "$pending" ]; then
            if [ "${{ inputs.apply_migrations }}" = "true" ]; then npx wrangler d1 migrations apply DB --remote
            else echo "::error::This branch has database migrations pitlanehq.app does not have: $pending. Tick apply_migrations only when the owner says so."; exit 1; fi
          fi
          if [ -n "$ADMINS" ]; then sed -i "s/^ADMINS = \".*\"/ADMINS = \"$ADMINS\"/" wrangler.toml; fi
          # its own Worker: another name, BETA = "1", no timed jobs, only the beta. address
          sed -i 's/^name = "pitlanehq"/name = "pitlanehq-beta"/' wrangler.toml
          sed -i 's/^\[vars\]/[vars]\nBETA = "1"/' wrangler.toml
          sed -i '/^\[triggers\]/,/^crons/d' wrangler.toml
          # the live room is pitlanehq.app's: the PCs and phones that send and watch live, and the sync nudges, are the same
          sed -i 's/^class_name = "LiveRoom"/class_name = "LiveRoom"\nscript_name = "pitlanehq"/' wrangler.toml
          if [ -n "$CUSTOM_DOMAIN" ]; then printf 'routes = [{ pattern = "beta.%s", custom_domain = true }]\n\n' "$CUSTOM_DOMAIN" > routes.toml; awk 'NR==FNR{r=r $0 "\n";next} !done && /^\[/{printf "%s", r; done=1} {print}' routes.toml wrangler.toml > w.toml && mv w.toml wrangler.toml; fi
          grep -q '^BETA = "1"' wrangler.toml && ! grep -q '^crons' wrangler.toml && grep -q '^script_name = "pitlanehq"' wrangler.toml
          npx wrangler deploy
          # the keys it needs to read the same accounts and data (never the webhooks' or the Discord bot's)
          for k in DATA_KEY EMAIL_PEPPER RESEND_API_KEY EMAIL_FROM TURN_KEY_ID TURN_KEY_TOKEN STEAM_WEB_API_KEY FCM_SERVICE_ACCOUNT; do
            v="${!k}"; if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$k"; fi
          done
          # what testers run now: production deploys only this (see "Production only from master, after testing")
          printf '{"build":"%s","branch":"%s","date":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > cloud.json
          npx wrangler r2 object put "pitlanehq-downloads/beta/cloud.json" --file cloud.json --remote --content-type application/json
          echo "## Test version: https://beta.$CUSTOM_DOMAIN ($GITHUB_REF_NAME, ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && inputs.channel == 'production'
        run: |
          set -e
          # the database: the one in PITLANE_D1_ID, or "pitlanehq" (created the first time)
          find_db() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="pitlanehq");console.log(d?d.uuid:"")}catch(e){console.log("")}})'; }
          DB_ID="$D1_ID"
          if [ -z "$DB_ID" ]; then DB_ID=$(find_db); fi
          if [ -z "$DB_ID" ]; then npx wrangler d1 create pitlanehq; DB_ID=$(find_db); fi
          if [ -z "$DB_ID" ]; then echo "::error::Could not create or find the D1 database. Check that the API token has Account · D1 · Edit."; exit 1; fi
          sed -i "s/^migrations_dir = \"migrations\"/migrations_dir = \"migrations\"\ndatabase_id = \"$DB_ID\"/" wrangler.toml
          npx wrangler d1 migrations apply DB --remote
          # the downloads bucket (the Windows and phone builds upload there); needs Account · Workers R2 Storage · Edit on the token
          npx wrangler r2 bucket create pitlanehq-downloads 2>/dev/null || true
          if [ -n "$SEASON_UPLOADERS" ]; then sed -i "s/^SEASON_UPLOADERS = \".*\"/SEASON_UPLOADERS = \"$SEASON_UPLOADERS\"/" wrangler.toml; fi
          if [ -n "$ADMINS" ]; then sed -i "s/^ADMINS = \".*\"/ADMINS = \"$ADMINS\"/" wrangler.toml; fi
          # your own domain (for example pitlanehq.com), once it is in your Cloudflare account, and its www.
          # address (Cloudflare makes its DNS record; the Worker sends www visitors to the domain itself)
          # routes is a top-level key: it goes before the first [table], or TOML would make it part of that table
          cp wrangler.toml wrangler.noroutes.toml
          if [ -n "$CUSTOM_DOMAIN" ]; then printf 'routes = [{ pattern = "%s", custom_domain = true }, { pattern = "www.%s", custom_domain = true }]\n\n' "$CUSTOM_DOMAIN" "$CUSTOM_DOMAIN" > routes.toml; awk 'NR==FNR{r=r $0 "\n";next} !done && /^\[/{printf "%s", r; done=1} {print}' routes.toml wrangler.toml > w.toml && mv w.toml wrangler.toml; fi
          npx wrangler deploy 2>&1 | tee deploy.log && st=${PIPESTATUS[0]} || st=1
          if [ "$st" != 0 ]; then
            if [ -n "$CUSTOM_DOMAIN" ]; then
              echo "::warning::Cloudflare did not attach $CUSTOM_DOMAIN / www.$CUSTOM_DOMAIN to the Worker (see the log above: usually an old DNS record of that name in the zone). The site was published without changing its domains."
              cp wrangler.noroutes.toml wrangler.toml
              npx wrangler deploy | tee deploy.log
            else
              exit 1
            fi
          fi
          if [ -n "$PITLANE_KEY" ]; then echo "$PITLANE_KEY" | npx wrangler secret put PITLANE_KEY; fi
          # emails (confirm the address, reset the password) through Resend
          if [ -n "$RESEND_API_KEY" ]; then echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          if [ -n "$EMAIL_FROM" ]; then printf '%s' "$EMAIL_FROM" | npx wrangler secret put EMAIL_FROM; fi
          # DATA_KEY seals telemetry, race analyses and authenticator secrets at rest; EMAIL_PEPPER salts the email hashes
          if [ -n "$DATA_KEY" ]; then printf '%s' "$DATA_KEY" | npx wrangler secret put DATA_KEY; fi
          if [ -n "$EMAIL_PEPPER" ]; then printf '%s' "$EMAIL_PEPPER" | npx wrangler secret put EMAIL_PEPPER; fi
          # the Patreon webhook's secret: the supporter badge by itself for the patrons
          if [ -n "$PATREON_WEBHOOK_SECRET" ]; then printf '%s' "$PATREON_WEBHOOK_SECRET" | npx wrangler secret put PATREON_WEBHOOK_SECRET; fi
          if [ -n "$LEMONSQUEEZY_WEBHOOK_SECRET" ]; then printf '%s' "$LEMONSQUEEZY_WEBHOOK_SECRET" | npx wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET; fi
          if [ -n "$TURN_KEY_ID" ]; then printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID; fi
          if [ -n "$STEAM_WEB_API_KEY" ]; then printf '%s' "$STEAM_WEB_API_KEY" | npx wrangler secret put STEAM_WEB_API_KEY; fi
          if [ -n "$TURN_KEY_TOKEN" ]; then printf '%s' "$TURN_KEY_TOKEN" | npx wrangler secret put TURN_KEY_TOKEN; fi
          # the Discord bot: its keys for the Worker, and its slash commands registered with Discord
          if [ -n "$DISCORD_PUBLIC_KEY" ]; then printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY; fi
          if [ -n "$DISCORD_BOT_TOKEN" ]; then printf '%s' "$DISCORD_BOT_TOKEN" | npx wrangler secret put DISCORD_BOT_TOKEN; fi
          # "Link Discord" in the apps (Discord's sign-in): the application's id and its OAuth2 client secret
          if [ -n "$DISCORD_APP_ID" ]; then printf '%s' "$DISCORD_APP_ID" | npx wrangler secret put DISCORD_APP_ID; fi
          if [ -n "$DISCORD_CLIENT_SECRET" ]; then printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET; fi
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT; fi
          if [ -n "$DISCORD_APP_ID" ] && [ -n "$DISCORD_BOT_TOKEN" ]; then node discord-register.mjs || echo "::warning::Discord did not take the bot's commands (see the log above)."; fi
          url=$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1)
          if [ -n "$CUSTOM_DOMAIN" ]; then url="https://$CUSTOM_DOMAIN"; fi
          {
            echo "## Pitlane HQ server is ready"
            echo
            echo "Address: **$url**"
            echo
            echo "Drivers sign in to their laps on this address with their Pitlane HQ account."
            echo
            echo "Put it in web/dist/server.json so every Pitlane HQ uses it; drivers only create an account in the app."
            if [ -n "$DISCORD_APP_ID" ]; then
              echo
              echo "Discord bot: Interactions Endpoint URL **$url/discord/interactions** · add it to a server: https://discord.com/oauth2/authorize?client_id=$DISCORD_APP_ID&scope=bot%20applications.commands&permissions=19456"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
