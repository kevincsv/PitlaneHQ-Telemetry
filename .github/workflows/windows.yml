name: Build PitlaneHQ.exe

# One app: compiles the agent (PitlaneHQ.exe, Go) and the native window (desktop/, C# / WPF) that runs it as its
# engine, then the one installer and the updater's zip with both, uploaded on the run page (Actions → this run →
# Artifacts).
#
# Every version goes to the testers first (docs/spec/pc-app.md, "Test builds"):
# - channel "beta" (the default, any branch): builds and puts the files in pitlanehq.app/dl/beta/, where the PCs of
#   testers and admins with Settings → About → Test builds on take them. Nobody else gets them.
# - channel "production" (master only): builds nothing. It takes the test build testers ran, checks it is this
#   commit's code, and puts those same files on the downloads page for everyone (promote).
# - skip_testing (production only): an urgent fix when the app is broken for people, only when the owner says so:
#   builds master and publishes it to everyone without a test build.

on:
  workflow_dispatch: # by hand only (Actions → Run workflow, or `gh workflow run windows.yml --ref <branch> -f channel=beta`): a push never builds
    inputs:
      channel:
        description: "beta = a test build for testers; production = promote the tested build to everyone (master)"
        type: choice
        options: [beta, production]
        default: beta
      skip_testing:
        description: "Urgent fix only, when the owner says so: build master and publish it to everyone without a test build"
        type: boolean
        default: false

# one build per branch at a time: a check on another branch never cancels master's (which publishes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: inputs.channel != 'production' || inputs.skip_testing
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build PitlaneHQ.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -mod=vendor -ldflags "-s -w -H windowsgui -X main.buildID=$env:GITHUB_SHA" -o PitlaneHQ.exe .
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item PitlaneHQ.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: out/


  # the native window and everything that ships: the installer, the updater's zip and version.json
  desktop:
    runs-on: windows-latest
    needs: build
    # code signing (Azure Artifact Signing, formerly Trusted Signing): the agent, the window and the installer are signed
    # when these secrets are set (Settings → Secrets and variables → Actions); without them the build is unsigned as before
    env:
      SIGN_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      # the Microsoft Store package (msix/) is built when the app's identity from Partner Center is set
      STORE_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: PitlaneHQ-windows
          path: engine
      - name: Build the window (with the agent next to it)
        shell: pwsh
        run: |
          # self-contained: the .NET runtime goes inside, so nothing else has to be installed; one file (the .csproj's
          # single-file publish) with only WPF's and WebView2's native files beside it
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          dotnet publish desktop/PitlaneHQ.Desktop/PitlaneHQ.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$ver -o out-desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item engine/PitlaneHQ.exe out-desktop/
          # only our two programs go to the signer (the .NET runtime's own files are already Microsoft's)
          New-Item -ItemType Directory -Force to-sign | Out-Null
          Move-Item out-desktop/PitlaneHQ.exe, out-desktop/PitlaneHQ.Desktop.exe to-sign/
      - name: Sign the agent and the window
        if: env.SIGN_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\to-sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Put the programs back
        shell: pwsh
        run: Move-Item to-sign/*.exe out-desktop/
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" installer\PitlaneHQ.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sign the installer
        if: env.SIGN_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signatures
        if: env.SIGN_ACCOUNT != ''
        shell: pwsh
        run: |
          foreach ($f in 'out-desktop/PitlaneHQ.exe','out-desktop/PitlaneHQ.Desktop.exe','dist-installer/PitlaneHQ-Setup.exe') {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PitlaneHQ-Setup
          path: dist-installer/PitlaneHQ-Setup.exe
      - name: Build the Microsoft Store package (MSIX)
        # uploaded on the run page only (Actions → this run → Artifacts → PitlaneHQ-Store), for a Partner Center
        # submission: the Store signs it and updates the PCs that installed it from there; never on the downloads page
        if: env.STORE_NAME != ''
        shell: pwsh
        env:
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ secrets.STORE_PUBLISHER_NAME }}
        run: |
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $esc = { param($v) [System.Security.SecurityElement]::Escape($v) }
          # the Store wants four numbers with the last one 0
          $m = (Get-Content msix/AppxManifest.xml -Raw).Replace('__NAME__', (& $esc $env:STORE_NAME)).Replace('__PUBLISHER_NAME__', (& $esc $env:STORE_PUBLISHER_NAME)).Replace('__PUBLISHER__', (& $esc $env:STORE_PUBLISHER)).Replace('__VERSION__', "$ver.0")
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item out-desktop/* pkg/ -Recurse
          Copy-Item msix/Assets pkg/Assets -Recurse
          Set-Content -Path pkg/AppxManifest.xml -Value $m -Encoding utf8
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { Write-Error "makeappx.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force dist-store | Out-Null
          & $mk.FullName pack /d pkg /p "dist-store/PitlaneHQ-$ver.msix" /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: env.STORE_NAME != ''
        with:
          name: PitlaneHQ-Store
          path: dist-store/*.msix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the test build (pitlanehq.app/dl/beta/)
        if: inputs.channel != 'production'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the updater's zip is the app's folder: the window, its files and the agent at the top
          (cd out-desktop && 7z a -tzip ../PitlaneHQ-windows.zip . >/dev/null)
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          min=$(sed -n 's/^const appMinVersion = "\(.*\)"/\1/p' main.go)
          printf '{"version":"%s","build":"%s","date":"%s","min":"%s","channel":"beta","branch":"%s","notes":{}}\n' "$ver" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${min:-0}" "$GITHUB_REF_NAME" > version.json
          node -e 'JSON.parse(require("fs").readFileSync("version.json","utf8"))'
          put() { npx --yes wrangler@4 r2 object put "pitlanehq-downloads/beta/$2" --file "$1" --remote --content-type "$3"; }
          put dist-installer/PitlaneHQ-Setup.exe PitlaneHQ-Setup.exe application/vnd.microsoft.portable-executable
          put PitlaneHQ-windows.zip PitlaneHQ-windows.zip application/zip
          # version.json goes last: the testers' PCs only see the build once its files are there
          put version.json version.json application/json
      - name: Publish to everyone (urgent fix without a test build)
        if: inputs.channel == 'production' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out-desktop && 7z a -tzip ../PitlaneHQ-windows.zip . >/dev/null)
          bash .github/scripts/pc-publish.sh PitlaneHQ-windows.zip dist-installer/PitlaneHQ-Setup.exe "$GITHUB_SHA"

  # production: the files testers ran go to everyone, never a new build of them
  promote:
    if: inputs.channel == 'production' && !inputs.skip_testing
    runs-on: ubuntu-latest
    steps:
      - name: Only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Production comes only from master: push the tested work to master, then run this on master"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the test build's commit, on whichever branch it was built
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take the test build
        shell: bash
        run: |
          curl -fsSL https://pitlanehq.app/dl/beta/version.json -o beta.json || { echo "::error::There is no test build yet: run this workflow with channel beta first"; exit 1; }
          b=$(node -p 'require("./beta.json").build||""')
          bv=$(node -p 'require("./beta.json").version||""')
          ver=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' main.go)
          echo "Test build $bv ($b), master $ver ($GITHUB_SHA)"
          git cat-file -e "$b^{commit}" 2>/dev/null || { echo "::error::The test build's commit $b is not in this repository any more"; exit 1; }
          # what testers ran must be this code: only the server, the docs and the workflows may have changed since
          if ! git diff --quiet "$b" HEAD -- . ':(exclude)cloud' ':(exclude)docs' ':(exclude).github' ':(exclude)CLAUDE.md' ':(exclude)CHANGELOG.md' ':(exclude)web/dist/app-news.json'; then
            git diff --stat "$b" HEAD -- . ':(exclude)cloud' ':(exclude)docs' ':(exclude).github' ':(exclude)CLAUDE.md' ':(exclude)CHANGELOG.md' ':(exclude)web/dist/app-news.json' | tail -20
            echo "::error::master has changes testers have not run: make a test build of master (channel beta), test it, then promote"
            exit 1
          fi
          [ "$bv" = "$ver" ] || { echo "::error::The test build is $bv and master is $ver"; exit 1; }
          curl -fsSL https://pitlanehq.app/dl/beta/PitlaneHQ-windows.zip -o PitlaneHQ-windows.zip
          curl -fsSL https://pitlanehq.app/dl/beta/PitlaneHQ-Setup.exe -o PitlaneHQ-Setup.exe
          echo "BETA_BUILD=$b" >> "$GITHUB_ENV"
      - name: Publish to everyone
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        # the build stays the test build's commit: the PCs that ran it already have it and are not updated again
        run: bash .github/scripts/pc-publish.sh PitlaneHQ-windows.zip PitlaneHQ-Setup.exe "$BETA_BUILD"
